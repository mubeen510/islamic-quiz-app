<div class="card" id="card">

  <!-- Card -->
  <div class="card-container"; style="background-color: rgb(30, 27, 27); border-radius: 2px; border-color: rgb(232, 28, 28);">
    <!-- SVG -->
    <svg class="card-svg" viewBox="0 0 300 550" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:rgb(225, 220, 220);stop-opacity:1" />
          <stop offset="100%" style="stop-color:rgb(75, 23, 23);stop-opacity:1" />
        </linearGradient>
        <mask id="circleMask">
    <rect width="70%" height="70%" fill="black"/>
    <circle cx="145" cy="110" r="35" fill="white"/>
  </mask>
      </defs>
      
      <path d="
        M0,150 
        C50,50 120,80 150,30
        C180,80 250,50 300,150
        L300,550 
        L0,550 
        Z
      " fill="url(#grad1)" />
      <image
  href="assets/download.png"
  x="110"
  y="60"
  width="70"
  height="100"
  mask="url(#circleMask)"
  preserveAspectRatio="xMidYMid meet"
/>

    </svg>

  <!-- WELCOME STATE -->
  <section class="state active" id="welcome-state">
  <div class="welcome-container">
   
    <h1>Welcome to Islamic Quiz App</h1>
    <p>Test your Islamic knowledge and learn interesting facts!</p>
    <h2>Select Your Category</h2>

    <div class="categories">
      <button class="category-btn" data-category="quran">Quran</button>
      <button class="category-btn" data-category="pillars">pillars</button>
      <button class="category-btn" data-category="prophets">prophets</button>
    </div>

    <button id="start-btn" class="start-btn" disabled>Start Quiz</button>
  </div>
</section>


  <!-- QUIz STATE -->
  <section class="state" id="quiz-state">
    <!-- Progress Bar -->
<div id="progress-container" style="width: 55%; background-color: #dadbd7b7; height: 10px; border-radius: 10px; margin-bottom: 5px; margin-top: 40px; margin-left: 70px;border-top-color: black; ">
  <div id="progress-bar" style="width: 0%; height: 100%; background-color: #4caf50; border-radius: 10px; "></div>
</div>
<!-- Add this under progress bar -->
<p id="question-counter" style="text-align:center; margin-bottom:5px;">0/0</p>


    
    <div id="timer" class="timer">
  ⏱️ Time Left: <span id="time-left">60</span>s
</div>

    <h3 id="question-text" style="font-size: 20px; font-weight: bold;"></h3>
    <div id="options"  "></div>
    <button id="next-btn">Next</button>
    <p id="explanation" class="mt-3"></p>

  </section>

  <!-- RESULT STATE -->
  <section class="state" id="result-state">
    <h2 id="result">Your Result</h2>
     <p id="score-text">Your Score: 0 / 0</p>
     <div id="summary-container"></div>
     <div id="high-score-box">
  <h4>🏆 Last 2 High Scores</h4>
  <ul id="high-score-list"></ul>
</div>

    <button id="restart-btn">Restart</button>
  </section>

</div>
